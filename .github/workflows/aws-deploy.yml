name: AWS CI and deployment

on:
  push:
    branches: ["fix/assessment-completion"]
    paths:
      - "BordspelApp.sln"
      - "BordspelApp.Domain/**"
      - "BordspelApp.Application/**"
      - "BordspelApp.Infrastructure/**"
      - "BordspelApp.Api/**"
      - "BordspelApp.WebApp/**"
      - "BordspelApp.Migrator/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "**/Dockerfile"
      - ".github/workflows/aws-deploy.yml"
      - "deploy/**"
      - "docs/AWS-Deployment.md"
      - ".env.example"
  workflow_dispatch:

concurrency:
  group: bordspelapp-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::669242775579:role/BordspelApp-GitHubActions-Role
  EC2_INSTANCE_ID: i-01352978121da42b2
  PUBLIC_WEBAPP_URL: https://web.13.60.219.216.sslip.io
  PUBLIC_API_URL: https://api.13.60.219.216.sslip.io
  ECR_API_REPOSITORY: bordspelapp-api
  ECR_WEBAPP_REPOSITORY: bordspelapp-webapp
  ECR_MIGRATOR_REPOSITORY: bordspelapp-migrator

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BordspelApp.sln

      - name: Build with warnings as errors
        run: dotnet build BordspelApp.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test BordspelApp.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=aws-tests.trx"

      - name: Build Docker images
        run: |
          docker build --file BordspelApp.Api/Dockerfile --tag bordspelapp-api:${GITHUB_SHA} .
          docker build --file BordspelApp.WebApp/Dockerfile --tag bordspelapp-webapp:${GITHUB_SHA} .
          docker build --file BordspelApp.Migrator/Dockerfile --tag bordspelapp-migrator:${GITHUB_SHA} .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  deploy:
    needs: verify-and-build
    # Deploy this assessment branch by default; set AWS_DEPLOY_ENABLED=false to pause deployment.
    if: ${{ vars.AWS_DEPLOY_ENABLED != 'false' && github.ref == 'refs/heads/fix/assessment-completion' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-bordspelapp

      - name: Check EC2 state
        id: instance
        run: |
          test -n "$EC2_INSTANCE_ID"
          state=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "EC2 state: $state"
          if [[ "$state" == "running" ]]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "EC2 is not running; deployment is intentionally skipped. CI remains successful."
          fi

      - name: Login to ECR
        if: steps.instance.outputs.deployable == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure deployment repositories exist
        if: steps.instance.outputs.deployable == 'true'
        run: |
          for repository in "$ECR_API_REPOSITORY" "$ECR_WEBAPP_REPOSITORY" "$ECR_MIGRATOR_REPOSITORY"; do
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repository" >/dev/null
            fi
          done

      - name: Build and push deployment images
        if: steps.instance.outputs.deployable == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --file BordspelApp.Api/Dockerfile --tag "$REGISTRY/$ECR_API_REPOSITORY:${GITHUB_SHA}" .
          docker build --file BordspelApp.WebApp/Dockerfile --tag "$REGISTRY/$ECR_WEBAPP_REPOSITORY:${GITHUB_SHA}" .
          docker build --file BordspelApp.Migrator/Dockerfile --tag "$REGISTRY/$ECR_MIGRATOR_REPOSITORY:${GITHUB_SHA}" .
          docker push "$REGISTRY/$ECR_API_REPOSITORY:${GITHUB_SHA}"
          docker push "$REGISTRY/$ECR_WEBAPP_REPOSITORY:${GITHUB_SHA}"
          docker push "$REGISTRY/$ECR_MIGRATOR_REPOSITORY:${GITHUB_SHA}"

      - name: Deploy through Systems Manager
        if: steps.instance.outputs.deployable == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          test -n "$EC2_INSTANCE_ID"
          jq -n \
            --arg compose "set -eu; git -C /opt/bordspel-app fetch origin fix/assessment-completion; git -C /opt/bordspel-app checkout fix/assessment-completion; git -C /opt/bordspel-app reset --hard origin/fix/assessment-completion; cd /opt/bordspel-app; export API_IMAGE=$REGISTRY/$ECR_API_REPOSITORY:${GITHUB_SHA} WEBAPP_IMAGE=$REGISTRY/$ECR_WEBAPP_REPOSITORY:${GITHUB_SHA} MIGRATOR_IMAGE=$REGISTRY/$ECR_MIGRATOR_REPOSITORY:${GITHUB_SHA}; aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY; docker compose --env-file /opt/bordspel-app/.env -f /opt/bordspel-app/docker-compose.yml pull api webapp migrator; docker compose --env-file /opt/bordspel-app/.env -f /opt/bordspel-app/docker-compose.yml run --rm migrator; docker compose --env-file /opt/bordspel-app/.env -f /opt/bordspel-app/docker-compose.yml up -d --remove-orphans" \
            '{"commands":["set -eu", $compose]}' > ssm-commands.json
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "BordspelApp deployment ${GITHUB_SHA}" \
            --parameters file://ssm-commands.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify public health endpoints
        if: steps.instance.outputs.deployable == 'true'
        env:
          WEBAPP_URL: ${{ env.PUBLIC_WEBAPP_URL }}
          API_URL: ${{ env.PUBLIC_API_URL }}
        run: |
          test -n "$WEBAPP_URL" && test -n "$API_URL"
          curl --fail --show-error --silent --retry 10 --retry-delay 5 "$WEBAPP_URL/health"
          curl --fail --show-error --silent --retry 10 --retry-delay 5 "$API_URL/health"
