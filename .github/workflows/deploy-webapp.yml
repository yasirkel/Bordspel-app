name: Deploy WebApp to Azure

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  WEBAPP_PROJECT: "BordspelApp.WebApp/BordspelApp.WebApp.csproj"
  AZURE_WEBAPP_NAME: "bordspel-app"
  PUBLISH_DIR: "publish"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BordspelApp.sln

      # EF migrations are applied by the deployment pipeline, not by WebApp startup.
      # Configure both secrets before enabling release deployments.
      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.32

      - name: Apply domain database migrations
        env:
          AZURE_DOMAIN_SQL_CONNECTION_STRING: ${{ secrets.AZURE_DOMAIN_SQL_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --context BordspelAppDbContext
          --project BordspelApp.Infrastructure/BordspelApp.Infrastructure.csproj
          --startup-project BordspelApp.WebApp/BordspelApp.WebApp.csproj
          --configuration Release
          --connection "$AZURE_DOMAIN_SQL_CONNECTION_STRING"

      - name: Apply Identity database migrations
        env:
          AZURE_IDENTITY_SQL_CONNECTION_STRING: ${{ secrets.AZURE_IDENTITY_SQL_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --context BordspelAppIdentityDbContext
          --project BordspelApp.Infrastructure/BordspelApp.Infrastructure.csproj
          --startup-project BordspelApp.WebApp/BordspelApp.WebApp.csproj
          --configuration Release
          --connection "$AZURE_IDENTITY_SQL_CONNECTION_STRING"

      - name: Build
        run: dotnet build "${{ env.WEBAPP_PROJECT }}" -c Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.WEBAPP_PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      # (optioneel maar handig) toon wat er gepublished is
      - name: List publish output
        run: ls -la "${{ env.PUBLISH_DIR }}"

      - name: Deploy to Azure Web App (Publish Profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
          package: ${{ env.PUBLISH_DIR }}
