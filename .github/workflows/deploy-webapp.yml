name: Deploy WebApp to Azure

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  WEBAPP_PATH: "BordspelApp.WebApp/BordspelApp.WebApp.csproj"
  AZURE_WEBAPP_NAME: "bordspel-app"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.WEBAPP_PATH }}

      - name: Build
        run: dotnet build ${{ env.WEBAPP_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.WEBAPP_PATH }} -c Release -o ./publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
