name: CI

on:
  push:
    branches:
      - master
      - development
      - release
      - 'fix/**'
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - development
      - release
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.json'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore BordspelApp.sln

      - name: Build solution
        run: dotnet build BordspelApp.sln --configuration Release --no-restore --warnaserror

      - name: Test solution
        run: dotnet test BordspelApp.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
